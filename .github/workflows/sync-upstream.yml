name: Sync with upstream

# Fork-only workflow (not in upstream). Every night it merges upstream's main
# into this fork's main, which brings in site updates and the LXT firmware
# binaries that upstream commits to firmware/. A merge conflict fails the run
# and GitHub emails the repository owner; nothing is pushed in that case.
#
# The default token cannot push changes to .github/workflows/, so a run fails
# at the push step when upstream has edited its workflows. To cover that, add
# a fine-grained personal access token with Contents and Workflows write
# access to this repository as the SYNC_PAT secret.

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/OpenBatteryInformation/openbatteryinformation.github.io.git
  HAS_PAT: ${{ secrets.SYNC_PAT != '' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT || github.token }}

      - name: Merge upstream/main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main
          before=$(git rev-parse HEAD)
          git merge --no-edit upstream/main
          if [ "$(git rev-parse HEAD)" = "$before" ]; then
            echo "Already up to date with upstream."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # A push made with the default token does not start other workflows,
      # so start the deploy explicitly. With SYNC_PAT the push starts it.
      - name: Deploy the merged site
        if: steps.merge.outputs.changed == 'true' && env.HAS_PAT != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-fork.yml --repo "$GITHUB_REPOSITORY" --ref main
