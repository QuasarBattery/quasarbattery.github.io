name: Deploy fork to GitHub Pages

# Fork-only workflow (not in upstream). The upstream pages.yml uploads the
# Pages artifact and deploys it in the same job; in this fork the deploy step
# keeps failing with "No artifacts named github-pages were found". Building
# and deploying in separate jobs avoids that, and deploying on every push to
# main publishes merged upstream updates without a manual step.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Same file list as upstream's pages.yml.
      - name: Stage web files
        run: |
          mkdir -p _site
          cp -r index.html obi.html setup.html download.html css js firmware assets _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
